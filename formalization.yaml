automation:
  spend_usd: 200
  methods:
  - method: agent
    models:
    - gpt-6-astra
    framework: Codex desktop with Autoform
    tool_setup: >-
      GPT-6 Astra in Codex coordinated native proof workers through Autoform's durable dependency
      plan. Workers constructed Lean proofs and iterated with the pinned Lean toolchain; separate
      checks built the modules and audited transitive axiom dependencies. Final library verification
      enumerated all module-owned declarations, including private and compiler-generated declarations.
      Statement audits compared the actual Lean objects with the frozen paper. Comparator wrappers
      and repository metadata were prepared in the same Codex session. Lean 4.34.0-rc2 and the exact
      Mathlib revision are locked by lean-toolchain, lakefile.toml and lake-manifest.json. The extension
      run uses Autoform's deterministic Codex CLI proof and review adapters through the maintainer's
      ChatGPT login, with shared kernel/axiom verification and targeted Lake builds. Codex is the
      configured proof backend.
    prompting_notes: >-
      Jack McCarthy requested formalization of the supplied characteristic-p paper in the style of
      the earlier characteristic-two project, then requested a private repository, formalization.yaml
      metadata and comparator files. The proof task retained arbitrary prescribed fields, incomplete
      bases, every allowed degree, every base point and the actual Banach witnesses; it did not replace
      the target by an assumed obstruction.
  - method: other
    models: []
    framework: Integration of pre-existing Lean proof sources
    tool_setup: >-
      The supplied existing ingredients were preserved or adapted in the library. They are not represented
      as newly authored proofs from the current GPT-6 Astra run. The paper's informal Claude/Claude
      Code authorship is recorded under sources and is distinct from the current formalization automation.
  notes: >-
    The reported total cost is USD 200, using the ChatGPT Pro subscription price specified by the
    maintainer. Hardware specifications and end-to-end runtime were not measured reliably for the
    whole project. Existing proof integrations and newly constructed proofs remain distinct. From
    the repository cleanup onward, the challenge and solution are checked only with Kim Morrison's
    leanprover/comparator; the earlier custom verification scripts and audit records have been removed
    from the current repository. During the later manuscript-expansion attempt, three Autoform launches
    on the saved Claude backend failed authentication with HTTP 401 before proof generation and reported
    zero input/output tokens. These failed launches added no Lean declaration and are not counted
    as successful proof work. Their automatically rewritten metadata was archived outside the repository;
    this file retains the original v0.4 structure and the maintainer-specified total cost of USD 200.
fidelity:
  divergences: >-
    The full operator counterexample keeps every prescribed nontrivially normed positive-characteristic
    field, including incomplete fields, and every k >= p. It produces E' = E with actual completeness
    and no equivalent ultrametric target norm; the same witnesses work for every finite index type
    of cardinality k and every base point. The no-lift and nowhere-C^omega formulations are bundled
    explicitly. The classification uses Fin k, with genuine finite-index transport for other finite
    types; its positive direction applies to arbitrary normed spaces and degree zero. Several auxiliaries
    are generalized, including arbitrary discrete index sets for the Laurent coefficient construction
    and arbitrary ordered unconditional Schauder bases with the source's orthogonal coordinate bound
    for the sorted lift. The coefficient map is kappa-linear, not Laurent-field-linear; the projective
    norm uses ordinary sums. The formalization does not assert injectivity of the completed determinant-array
    map. The comparator exposes two contradiction corollaries in the earlier characteristic-two challenge
    style, together with the full positive operator form of Main Theorem (2). Its general assertion
    quantifies over types in universe zero; its characteristic-p corollary fixes arbitrary K : Type
    u and ranges over Banach E,F : Type u with index Fin k. The global statement uses Mathlib constants
    directly. The fixed-field hypothesis uses the transparent predicate BanachPrecompositionAnalytic
    K k, defined identically in both comparator files using Mathlib's existing definitions; unfolding
    it recovers the original quantified hypothesis. Neither contradiction corollary is presented as
    equivalent to the full constructive operator counterexample or factorial classification; those
    stronger theorems and their general universe parameters remain in the library. The operator form
    of Main Theorem (2) uses independent universes for all five types, arbitrary finite indices, all
    n : WithTop ℕ∞, an ultrametric nontrivially normed field and an ultrametric target with explicit
    hF : SphericallyComplete F. This second transparent predicate says that every nonempty family
    of pairwise-meeting closed balls has a common point; it is definitionally the property of the
    existing library class. The solution constructs that class instance from hF and invokes the existing
    theorem. No characteristic or degree restriction, or completeness assumption on K, E or E', is
    introduced. The comparator checks the current challenge and solution against comparator.json,
    including both fixed predicates and their transitive dependencies. No proposed or open paper claim
    is included as an axiom. The current challenge still selects only the original three proved statements;
    it does not claim to check the new finite-coordinate, bundle, parameter, shear, tensor or no-largest-domain
    results. Paper proofs of these extensions are distinguished from the Lean-checked scope.
review:
  status: agent-reviewed
  reviewers: []
  notes: >-
    Earlier semantic reviews and separate model jury passes examined selected declarations for faithfulness,
    proof integrity and code quality. Some reviews returned mixed scores, abstentions or timeouts;
    no global clean-jury result or human expert review is claimed. The paper received a subsequent
    editorial pass with substantive explanations compared against the Lean development. The new family
    and no-largest-domain sections received independent informal mathematical reviews, including the
    incomplete-field scope, all-prime degree-gap argument, padding retraction, finite-coordinate reflection
    and fixed-degree l1 factorization. A further independent agent paper audit dated 25 September
    2026 reviewed scope, arguments, organization and terminology. The resulting revision records the
    nonarchimedean coefficient bound, quotient-parameter and polynomial-approximation consequences,
    set-sized maximal-domain argument, and canonical exterior support. It clarifies completion in
    the rigid-source construction, preserves the spherical-target proof as Section 2, moves the domain
    argument before the tensor criterion and exterior preliminaries next to their use, and consolidates
    the finite-dimensional completeness proof. These informal reviews do not constitute kernel verification
    or human expert review. The unchanged three-statement challenge was rechecked on 25 September
    2026 with Kim Morrison's comparator; the solution was accepted by Lean's default kernel. This
    check does not cover the new manuscript extensions. The new finite-coordinate reflection, core-family
    and shear nodes passed the shared proof-verification gate. These results do not establish completion of the
    expanded manuscript. The canonical exterior-support module also passed the shared kernel/axiom
    gate. The full proof library and solution build passed with all four new branches included (3149
    build jobs). The requested statement-clarity repairs are now complete: the family, shear and
    canonical-support propositions each have a combined public theorem alongside their component
    lemmas. All three combined statements passed the shared proof-verification gate, and the full
    library and solution build passed again on 25 September 2026. The fresh independent Codex jury
    passed all four extension nodes: statement faithfulness and proof integrity were each 5/5 for
    every node; code quality was 5/5 for families and shear, and 4/5 for reflection and canonical
    support. These node-level results do not certify the remaining manuscript or constitute human
    expert review.
alignment:
  namespace: AlternatingAnalytic
  theorem_map: THEOREM_MAP.md
  comparator_scope: >-
    Three theorems in a challenge importing only Mathlib. Two are contradiction corollaries of the
    proved construction: the universal all-fields analytic-smoothness assertion, and the fixed-prescribed-field
    Banach assertion in characteristic p and degree k >= p. The latter names its original universal
    hypothesis BanachPrecompositionAnalytic K k. The third is the operator form of Main Theorem (2)
    for independent universes, arbitrary finite indices and all differentiability orders n : WithTop
    ℕ∞, including omega, with explicit hF : SphericallyComplete F. Both predicates are fixed transparent
    definitions identical in challenge and solution. The source alignment below records the stronger
    library theorems, not an asserted equivalence between the two contradiction corollaries and the
    full negative results.
  statements:
  - source: Counterexample theorem (thm:main) and adjacent C^omega sharpness statement
    lean: AlternatingAnalytic.exists_banach_counterexample_full
    module: AlternatingAnalytic.MainTheorem
    status: proved
    note: All prescribed fields, actual Banach E = E', no equivalent ultrametric target norm, all
      finite indices and all base points.
  - source: Explicit construction underlying the Counterexample theorem (thm:main)
    lean: AlternatingAnalytic.exists_nowhereAnalytic_banach_counterexample
    module: AlternatingAnalytic.Main
    status: proved
  - source: 'Corollary cor:class: the exact operator factorial classification'
    lean: AlternatingAnalytic.factorial_ne_zero_iff_allBanachPrecompositionAnalytic
    module: AlternatingAnalytic.Analysis.FactorialClassification
    status: proved
  - source: 'Proposition lift: bounded lift and analyticity equivalences'
