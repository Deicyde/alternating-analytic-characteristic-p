automation:
  spend_usd: 200
  methods:
  - method: agent
    models:
    - gpt-6-astra
    framework: Codex desktop with Autoform
    tool_setup: GPT-6 Astra in Codex coordinated native proof workers through Autoform's durable dependency
      plan. Workers constructed Lean proofs and iterated with the pinned Lean toolchain; separate checks
      built the modules and audited transitive axiom dependencies. Final library verification enumerated
      all module-owned declarations, including private and compiler-generated declarations. Statement
      audits compared the actual Lean objects with the frozen paper. Comparator wrappers and repository
      metadata were prepared in the same Codex session. Lean 4.34.0-rc2 and the exact Mathlib revision
      are locked by lean-toolchain, lakefile.toml and lake-manifest.json. The extension run uses Autoform's
      deterministic Codex CLI proof and review adapters through the maintainer's ChatGPT login, with shared
      kernel/axiom verification and targeted Lake builds. Codex is the configured proof backend.
    prompting_notes: Jack McCarthy requested formalization of the supplied characteristic-p paper in the
      style of the earlier characteristic-two project, then requested a private repository, formalization.yaml
      metadata and comparator files. The proof task retained arbitrary prescribed fields, incomplete bases,
      every allowed degree, every base point and the actual Banach witnesses; it did not replace the target
      by an assumed obstruction.
  - method: other
    models: []
    framework: Integration of pre-existing Lean proof sources
    tool_setup: The supplied existing ingredients were preserved or adapted in the library. They are not
      represented as newly authored proofs from the current GPT-6 Astra run. The paper's informal Claude/Claude
      Code authorship is recorded under sources and is distinct from the current formalization automation.
  notes: The reported total cost is USD 200, using the ChatGPT Pro subscription price specified by the
    maintainer. Hardware specifications and end-to-end runtime were not measured reliably for the whole
    project. Existing proof integrations and newly constructed proofs remain distinct. Codex is the persisted
    proof backend. Challenge and solution validation uses only Kim Morrison’s leanprover/comparator; custom
    verification scripts and operational audit records are excluded from the published repository.
fidelity:
  divergences: 'The full operator counterexample keeps every prescribed nontrivially normed positive-characteristic
    field, including incomplete fields, and every k >= p. It produces E'' = E with actual completeness
    and no equivalent ultrametric target norm; the same witnesses work for every finite index type of
    cardinality k and every base point. The no-lift and nowhere-C^omega formulations are bundled explicitly.
    The classification uses Fin k, with genuine finite-index transport for other finite types; its positive
    direction applies to arbitrary normed spaces and degree zero. Several auxiliaries are generalized,
    including arbitrary discrete index sets for the Laurent coefficient construction and arbitrary ordered
    unconditional Schauder bases with the source''s orthogonal coordinate bound for the sorted lift. The
    coefficient map is kappa-linear, not Laurent-field-linear; the projective norm uses ordinary sums.
    The formalization does not assert injectivity of the completed determinant-array map. The comparator
    exposes two contradiction corollaries in the earlier characteristic-two challenge style, together
    with the full positive operator form of Main Theorem (2). Its general assertion quantifies over types
    in universe zero; its characteristic-p corollary fixes arbitrary K : Type u and ranges over Banach
    E,F : Type u with index Fin k. The global statement uses Mathlib constants directly. The fixed-field
    hypothesis uses the transparent predicate BanachPrecompositionAnalytic K k, defined identically in
    both comparator files using Mathlib''s existing definitions; unfolding it recovers the original quantified
    hypothesis. Neither contradiction corollary is presented as equivalent to the full constructive operator
    counterexample or factorial classification; those stronger theorems and their general universe parameters
    remain in the library. The operator form of Main Theorem (2) uses independent universes for all five
    types, arbitrary finite indices, all n : WithTop ℕ∞, an ultrametric nontrivially normed field and
    an ultrametric target with explicit hF : SphericallyComplete F. This second transparent predicate
    says that every nonempty family of pairwise-meeting closed balls has a common point; it is definitionally
    the property of the existing library class. The solution constructs that class instance from hF and
    invokes the existing theorem. No characteristic or degree restriction, or completeness assumption
    on K, E or E'', is introduced. The comparator checks the current challenge and solution against comparator.json,
    including both fixed predicates and their transitive dependencies. No proposed or open paper claim
    is included as an axiom. The current challenge still selects only the original three proved statements;
    it does not claim to check the new finite-coordinate, bundle, parameter, shear, tensor or no-largest-domain
    results. Paper proofs of these extensions are distinguished from the Lean-checked scope.'
review:
  status: agent-reviewed
  reviewers: []
  notes: Twelve extension nodes have complete clean independent Codex jury reviews, each with 5/5 for
    statement faithfulness and proof integrity and at least 4/5 for code quality. These now include the
    spherical-target categorical result and the combined categorical Main Theorem, whose earlier incomplete
    faithfulness reports were timeouts. The repaired joint-action summary and the nine-declaration analytic
    bundle module have passed the shared build, kernel and axiom gate; fresh independent reviews of those
    two nodes remain pending. The full library-and-solution integration build passed 3,186 jobs on the
    recorded source snapshot. The unchanged three-statement challenge passed Kim Morrison’s comparator
    locally, including default-kernel replay; this does not certify the additional library results. GitHub
    CI did not run because of an account billing/spending restriction. Informal manuscript audits are
    distinct from kernel verification and jury review. No human expert review or complete formalization
    of the expanded manuscript is claimed. Bundle morphisms and the literal bundle bifunctor remain unfinished.
alignment:
  namespace: AlternatingAnalytic
  theorem_map: THEOREM_MAP.md
  comparator_scope: 'Three theorems in a challenge importing only Mathlib. Two are contradiction corollaries
    of the proved construction: the universal all-fields analytic-smoothness assertion, and the fixed-prescribed-field
    Banach assertion in characteristic p and degree k >= p. The latter names its original universal hypothesis
    BanachPrecompositionAnalytic K k. The third is the operator form of Main Theorem (2) for independent
    universes, arbitrary finite indices and all differentiability orders n : WithTop ℕ∞, including omega,
    with explicit hF : SphericallyComplete F. Both predicates are fixed transparent definitions identical
    in challenge and solution. The source alignment below records the stronger library theorems, not an
    asserted equivalence between the two contradiction corollaries and the full negative results.'
  statements:
  - source: Counterexample theorem (thm:main) and adjacent C^omega sharpness statement
    lean: AlternatingAnalytic.exists_banach_counterexample_full
    module: AlternatingAnalytic.MainTheorem
    status: proved
    note: All prescribed fields, actual Banach E = E', no equivalent ultrametric target norm, all finite
      indices and all base points.
  - source: Explicit construction underlying the Counterexample theorem (thm:main)
    lean: AlternatingAnalytic.exists_nowhereAnalytic_banach_counterexample
    module: AlternatingAnalytic.Main
    status: proved
  - source: 'Corollary cor:class: the exact operator factorial classification'
    lean: AlternatingAnalytic.factorial_ne_zero_iff_allBanachPrecompositionAnalytic
    module: AlternatingAnalytic.Analysis.FactorialClassification
    status: proved
  - source: 'Proposition lift: bounded lift and analyticity equivalences'
    lean: Round24Transfer.tfae_Q
    module: AlternatingAnalytic.Analysis.LiftCriterion
    status: proved
    note: Integrated existing source proof, with provenance retained.
  - source: 'Theorem FF: the finite-field multiplier obstruction'
    lean: AlternatingAnalytic.finiteField_multiplier_theorem
    module: AlternatingAnalytic.Algebra.FiniteFieldTheorem
    status: proved
    note: The needed infinite Ramsey theorem is proved locally; the obstruction is not an axiom.
  - source: 'Proposition supp: the completed coefficient map and sharp support estimate'
    lean: AlternatingAnalytic.completedLaurentCoefficient_full_properties
    module: AlternatingAnalytic.Analysis.LaurentCoefficientTheorem
    status: proved
  - source: 'Lemma Psi: all four residue-lift properties, including full grouped polarization'
    lean: AlternatingAnalytic.laurentResidueLift_full_properties
    module: AlternatingAnalytic.Analysis.LaurentResidueTheorem
    status: proved
  - source: 'Proposition nonultra: the target admits no equivalent ultrametric norm'
    lean: AlternatingAnalytic.laurentExterior_not_hasEquivalentUltrametricNorm
    module: AlternatingAnalytic.Analysis.LaurentCompletedCoefficient
    status: proved
    note: Disjoint-block growth is also transported to the final prescribed-field witnesses.
  - source: 'Lemma ext(2): heterogeneous dense multilinear extension'
    lean: AlternatingAnalytic.exists_denseMultilinearFamilyExtension_of_bound
    module: AlternatingAnalytic.Analysis.DenseMultilinearFamilyExtension
    status: proved
  - source: 'Remark K2: nonspherical completeness and descending empty balls'
    lean: AlternatingAnalytic.hasEmptyDescendingBallSequence_iff
    module: AlternatingAnalytic.Analysis.NonsphericalSequence
    status: proved
  - source: 'Remark FFunit: the normalized multiplier example and its support and cluster values'
    lean: AlternatingAnalytic.normalizedMultiplierLift_pol1, AlternatingAnalytic.exteriorSupportDim_normalizedMultiplierLift_le,
      AlternatingAnalytic.clusterValue_normalizedClusterLift
    module: AlternatingAnalytic.Algebra.NormalizedMultiplierLift
    status: proved
  - source: 'Remark sorted: the contracting lift and its actual convergent infinite determinant formula'
    lean: AlternatingAnalytic.exists_sortedSchauderLift
    module: AlternatingAnalytic.Analysis.SortedBasisFormula
    status: proved
  - source: 'Lemma compatible-extension in sec:theoremA: extension preserving compatible operator bounds'
    lean: exists_extension_of_sphericallyComplete
    module: AlternatingAnalytic.Analysis.SphericalCompleteness
    status: proved
    note: Existing global declaration; an ultrametric seminormed source and an ultrametric, spherically
      complete target suffice, with no completeness assumption on the field or source.
  - source: 'Proposition alt-spherical in sec:theoremA: spherical completeness of alternating-map spaces'
    lean: sphericallyCompleteSpace_continuousAlternatingMap
    module: AlternatingAnalytic.Analysis.SphericalAnalytic
    status: proved
    note: Existing global instance; an ultrametric field and a spherically complete ultrametric target,
      with arbitrary normed source.
  - source: 'Operator form of Main Theorem (2) in sec:theoremA: spherically complete ultrametric targets'
    lean: ContinuousAlternatingMap.contDiff_compContinuousLinearMapCLM_of_sphericallyComplete
    module: AlternatingAnalytic.Analysis.SphericalAnalytic
    status: proved
    note: The operator form is proved in standalone Section 2 following the existing Lean extension, spherical-completeness
      and retraction proofs. The actual categorical counterpart is now implemented in AlternatingAnalytic.Category.AlternatingRegularity
      and passed the shared proof gate; its independent jury review remains pending.
  - source: 'Proposition discrete: complete targets with an equivalent ultrametric norm'
    lean: AlternatingAnalytic.analyticAt_of_equivalentUltrametricNorm_discreteValueGroup
    module: AlternatingAnalytic.Analysis.DiscreteTargetAnalytic
    status: proved
  - source: 'Categorical foundations: normed spaces and regularity on hom spaces'
    lean: AlternatingAnalytic.NormedSpaceCat; AlternatingAnalytic.FunctorContDiffOnHoms; AlternatingAnalytic.FunctorAnalyticOnHoms;
      AlternatingAnalytic.FunctorCPolynomialOnHoms
    module: AlternatingAnalytic.Category.NormedSpace
    status: proved
    note: Actual categories and operator-norm hom spaces, canonical coordinates, and coordinate-invariance
      lemmas. No completeness of K. Shared verification gate passed; independent jury clean. This does
      not establish the alternating bifunctors. Fresh Codex jury on 25 September 2026 gave faithfulness
      5/5 and proof integrity 5/5; code quality was5 for finite-coordinate families and4 for category
      foundations/radius. No human expert review is claimed.
  - source: 'Main Theorem (1) and (2): full categorical statements and joint regularity'
    lean: AlternatingAnalytic.alternatingFunctor_main; AlternatingAnalytic.alternatingSphericalFunctor_main;
      AlternatingAnalytic.alternatingSphericalFunctor_main_of_charP
    module: AlternatingAnalytic.Category.AlternatingRegularity
    status: proved
    note: Actual functors on normed spaces, Banach spaces and spherical targets; unconditional smoothness,
      both exact factorial analytic equivalences, finite-polynomial positive cases, and the positive-characteristic
      spherical corollary. Joint action includes an explicit degree-(k+1) lift, bounds and identity slice;
      degree zero is handled explicitly. Shared proof-verification gate passed. Independent jury is clean
      for the actual functors (5/5/4), factorial classification (5/5/5), spherical result (5/5/5), and
      combined Main Theorem (5/5/4). The joint-action summary repair passed the shared gate and awaits
      its fresh full review. Earlier incomplete reviews are retained as historical evidence; no human
      review is claimed.
  - source: 'prop:finite-coordinate and cor:finite-dimensional-positive: positive operator cases'
    lean: ''
    module: ''
    status: not-formalized
    note: Formalize both cases, continuous finite coordinates on the operator domain E or on its codomain
      E', over arbitrary nontrivially normed K. Derive the finite-dimensional corollary over complete
      K, with arbitrary normed value target F. Retain degree zero and degrees above the coordinate dimension.
      This is distinct from finite-coordinate parameter reflection.
  - source: 'rem:finite-target-reduction: finite-dimensional value targets'
    lean: ''
    module: ''
    status: not-formalized
    note: Over complete K and nonzero finite-dimensional F, analyticity at each specified operator is
      equivalent to analyticity for scalar-valued forms. Treat F = 0 separately and derive analyticity
      over spherically complete nonarchimedean K for any norm on F. Do not assert that finite-dimensional
      F suffices over every field.
  - source: 'Remark after cor:finite-dimensional-positive: discontinuous coordinates over an incomplete
      field'
    lean: ''
    module: ''
    status: not-formalized
    note: For a in the completion of K but outside K, give K + Ka the induced norm and prove that the
      coordinate of a in the basis (1,a) is discontinuous. This example explains the continuous-coordinate
      hypothesis; it alone does not prove nonanalyticity of alternating precomposition.
  - source: 'rem:nonspherical-analytic-target: weighted c_0 example'
    lean: ''
    module: ''
    status: not-formalized
    note: Construct the stated weighted norm on c_0(N,F_p((t))), its comparison with the supremum norm
      and completeness, and the nested closed balls with empty intersection. Prove analytic precomposition
      for all normed source spaces and all finite degrees using the existing positive theorem and norm
      transport. A general sufficient theorem does not by itself formalize this example.
  - source: 'Introduction vector-bundle motivation: the C^n multifunctor construction'
    lean: ''
    module: ''
    status: not-formalized
    note: Formalize the cocycle construction for jointly C^n maps on morphism spaces, including mixed
      variance, operator-valued bundle morphisms and independence of trivializations. Inverse transition
      maps are part of the cocycle data. This tracks the construction proved in the manuscript without
      assuming an unrestricted analytic alternating functor.
  - source: Bundle consequences after fam:cor:quotient-parameters and admissible inverse families
    lean: ''
    module: ''
    status: not-formalized
