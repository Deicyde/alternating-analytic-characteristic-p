version: '0.4'
project:
  name: alternating-analytic-characteristic-p
  description: Lean 4 / Mathlib formalization of alternating precomposition in positive characteristic.
    For every prescribed nontrivially normed field K of prime characteristic p, including incomplete K,
    and every k >= p, the construction gives actual K-Banach spaces E and F, with E' = E, such that F
    has no equivalent ultrametric norm and degree-k alternating precomposition has no bounded multilinear
    lift, is nowhere analytic, and is nowhere ContDiffAt K omega. The same witnesses work for every finite
    index type of cardinality k. The exact factorial classification states that precomposition is analytic
    for all Banach triples over K if and only if k! is nonzero in K. The development includes the finite-field
    Ramsey obstruction, ordinary-sum projective exterior completion, coefficient support estimate, scalar
    extension and descent, and the paper's proved complements. These operator results underlie parts (1)
    and (2) of the expanded paper's four-part categorical Main Theorem. The joint morphism action and
    its laws are formalized; categorical functors and their regularity classification remain to be assembled.
    The revised manuscript, Analyticity of alternating-map functors and vector bundles, also proves finite-coordinate
    analytic reflection and bundle preservation, positive c_0 and ordinary l1 parameter results, an invertible-family
    obstruction, a tensor criterion for universal analytic reflection, and nonexistence of a largest full
    analytic domain over F_p(t) in every degree k >= p. Further paper proofs preserve the coefficient
    radius in the nonarchimedean finite-coordinate case, exhibit failure of descent through quotient parameters
    and polynomial approximation without a common analytic radius, describe set-sized maximal analytic
    domains, and identify canonical exterior support with the contraction span. The extension now includes
    checked finite-coordinate analytic reflection, radius-preserving nonarchimedean reflection, finite-coordinate
    alternating morphism families, core admissible-family laws, the invertible-shear counterexample and
    canonical exterior support. The actual bundle conclusion of Main Theorem (3), Main Theorem (4), the
    bundled categorical classification and the other extension results remain unfinished; THEOREM_MAP.md
    records exact completed and pending statements.
  authors:
  - Jack McCarthy
  responsible_maintainers:
  - Jack McCarthy
  license: No license chosen yet (all rights reserved pending the maintainer's decision)
repository:
  role: substantive-development
sources:
- title: Analyticity of alternating-map functors and vector bundles
  authors:
  - Jack McCarthy
  contributors:
  - name: Claude (Anthropic), working in Claude Code
    role: credited by the paper for producing the informal result, proof, and write-up
  id: https://github.com/Deicyde/alternating-analytic-characteristic-p/blob/main/paper/charp.pdf
  type: manuscript
  location: Counterexample theorem (thm:main), operator Corollary cor:class, the operator form of Main
    Theorem (2), their supporting development, and the proved complements
  relationship: formalizes
  note: The current manuscript is paper/charp.pdf, with editable source paper/charp.tex. Its author disclosure
    distinguishes the original Claude-assisted informal work from the later Codex/Autoform formalization
    and editorial revision. The original snapshots remain in sources/; their earlier formalization-status
    statements are historical. The polished manuscript incorporates the corrections from comparison with
    Lean and improves the exposition without changing the operator counterexample or factorial criterion.
    It also supplies proofs of the positive cases, with the finite-dimensional additions distinguished
    from the formalized scope in THEOREM_MAP.md. Standalone Section 2, Spherically complete targets, proves
    part (2) of the Main Theorem. It follows the existing Lean extension, spherical-completeness and retraction
    arguments for the operator form, then completes the categorical statement by bounded bilinear postcomposition
    and closure of alternating-map spaces. The introduction leads with a categorical Main Theorem in four
    parts. Part (1) states that for every nontrivially normed field K and every integer k >= 0, Alt^k
    from Vec_K^op times Vec_K to Vec_K is always C^infinity and is analytic exactly when k! is nonzero
    in K, with the same assertions for Ban_K. Vec_K uses ordinary, not necessarily ultrametric, norms
    and bounded linear maps; Ban_K is its full subcategory of complete spaces. Part (2) says that, for
    K of positive characteristic, Alt^k from Vec_K^op times Vec_K^circ to Vec_K^circ is analytic in every
    finite degree, where Vec_K^circ consists of ultrametric, spherically complete spaces. Regularity refers
    to the joint maps on each pair of morphism spaces with operator norms. Neither part requires completeness
    of K. In characteristic zero, part (1) already gives analyticity in every finite degree for all normed
    spaces. The unchanged Lean operator result underlying part (2) applies to every ultrametric nontrivially
    normed field, with no characteristic restriction; positive characteristic supplies ultrametricity
    for the categorical statement. Parts (1) and (2) follow mathematically from the formalized operator
    results; the Main Theorem's ordinary smoothness input is in the pinned Mathlib dependency. The joint
    action and its identity/composition laws are now formalized; the categorical functors and joint regularity
    classification remain pending. The introduction's vector-bundle motivation explains how jointly C^n
    multifunctors transform transition cocycles, using inverse transitions in contravariant arguments,
    and applies this to alternating-map bundles and differential forms. This general construction is explanatory
    mathematics, not additional Lean bundle or functor declarations. A weighted c_0 example shows that
    spherical completeness of the given target norm is not necessary for analyticity; its sufficient discrete-target
    criterion is formalized, while the example itself is an additional informal corollary. The paper asks
    for an intrinsic necessary and sufficient condition on the target, in one degree or all finite degrees,
    as an open problem left unresolved by the present results. Part (3) proves that Alt^k preserves every
    analytic morphism family parametrized by an open subset of K^d and hence analytic normed vector bundles,
    with operator-valued analytic morphisms, over manifolds with such charts. The fibers may be arbitrary
    normed spaces. Over incomplete K, finite algebraic dimension is not substituted for continuous coordinates.
    Part (4) proves that for K = F_p(t), every prime p and k >= p, no largest full analytic domain exists,
    even in the category of pairs of finite algebraic dimensional nonarchimedean normed spaces and with
    isomorphism closure taken in the chosen ambient category. Two individually analytic objects have a
    nonanalytic cross-action. This construction uses incomplete objects; the analogous existence questions
    over complete fields or for Banach pairs remain open. Further proved manuscript results define admissible
    morphism families, establish the universal-target core and split-destination criterion, give positive
    c_0 and ordinary l1 parameter theorems, transfer the obstruction to an invertible shear family, and
    characterize universal Banach-valued analytic reflection by exponentially bounded projections onto
    diagonal tensor powers. Infinite ordinary l1 spaces over a complete nonarchimedean field separate
    the tensor reflection property from the weaker alternating-family property. The 25 September 2026
    revision adds the nonarchimedean coefficient-bound refinement fam:rem:radius, the quotient-parameter
    obstruction fam:cor:quotient-parameters, and the smooth but nonanalytic polynomial-approximation example
    fam:cor:no-common-radius. Proposition dom:maximal describes analytic domains as cliques on a fixed
    set of objects and obtains maximal extensions containing the available universal-target core. Proposition
    prop:canonical-support proves the smallest supporting subspace and its equality with the contraction
    span, including the finite contraction-matrix rank consequence. The completion principle preceding
    dom:rigid is now explained explicitly. Finite-coordinate reflection, the core admissible-family laws,
    the invertible-shear counterexample and canonical exterior support now have checked Lean declarations.
    The other listed results remain pending. The intrinsic universal-target and admissible- parameter
    classifications, possible extensions of the split-pair category, and the remaining complete-field/Banach
    domain questions remain mathematical open problems. For C^infinity smoothness the whole product category
    already suffices. The alternative infinite-field obstruction remains unproved; its canonical-support
    identity is now formalized, with the finite-ambient contraction-matrix formula. The finite-support
    transport remains pending. The large-index nonarchimedean counterexample is a proposed, unproved extension.
    Proposed and open items are not claimed as proved.
