version: "v0.4"

project:
  name: "alternating-analytic-characteristic-p"
  description: >
    Lean 4 / Mathlib formalization of alternating precomposition in positive characteristic.
    For every prescribed nontrivially normed field K of prime characteristic p, including
    incomplete K, and every k >= p, the construction gives actual K-Banach spaces E and F,
    with E' = E, such that F has no equivalent ultrametric norm and degree-k alternating
    precomposition has no bounded multilinear lift, is nowhere analytic, and is nowhere
    ContDiffAt K omega. The same witnesses work for every finite index type of cardinality k.
    The exact factorial classification states that precomposition is analytic for all Banach
    triples over K if and only if k! is nonzero in K. The development includes the finite-field
    Ramsey obstruction, ordinary-sum projective exterior completion, coefficient support
    estimate, scalar extension and descent, and the paper's proved complements.
  authors: ["Jack McCarthy"]
  responsible_maintainers: ["Jack McCarthy"]
  license: "No license chosen yet (all rights reserved pending the maintainer's decision)"

repository:
  role: "substantive-development"

sources:
  - title: "Precomposition on continuous alternating maps is not analytic in positive characteristic"
    authors: ["Jack McCarthy"]
    contributors:
      - name: "Claude (Anthropic), working in Claude Code"
        role: "credited by the paper for producing the informal result, proof, and write-up"
    id: "https://github.com/Deicyde/alternating-analytic-characteristic-p/blob/main/paper/charp.pdf"
    type: "manuscript"
    location: "Theorem main, Corollary class, their supporting development, and the proved complements"
    relationship: "formalizes"
    note: >
      The current manuscript is paper/charp.pdf, with editable source paper/charp.tex.
      Its author disclosure distinguishes the original Claude-assisted informal work from
      the later Codex/Autoform formalization and editorial revision. The original snapshots
      remain in sources/; their earlier formalization-status statements are historical.
      The polished manuscript incorporates the corrections from comparison with Lean and
      improves the exposition without changing the main theorem or factorial criterion. It
      also supplies proofs of the positive cases, with the finite-dimensional additions
      distinguished from the formalized scope in THEOREM_MAP.md.
      Announced and open items are not claimed as proved.
    license: ""
    author_endorsement: "participated"
  - title: "Existing Lean ingredients supplied with the round-24 paper materials"
    authors: []
    id: "https://github.com/Deicyde/alternating-analytic-characteristic-p/tree/main/AlternatingAnalytic/Analysis"
    type: "software"
    relationship: "adapts"
    note: >
      Existing proofs of the lift criterion, factorial-invertible positive result, symmetric
      diagonal obstruction, positive-characteristic ultrametricity, spherical completeness
      and extension, and Theorem A were integrated into the development. These supplied
      ingredients are distinct from proofs newly authored in the formalization session;
      their exact original model authorship is not inferred here.
    license: ""
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/Deicyde/alternating-analytic-counterexample"
    relationship: "other"
    note: >
      Earlier characteristic-two formalization used as a workflow precedent and cited by the
      paper for comparison. Its different Pfaffian/parity construction is not re-proved or
      re-audited here, and that repository is unchanged. This project establishes the new
      every-prescribed-field result with a target having no equivalent ultrametric norm.

classification:
  arxiv: ["math.FA", "math.DG"]
  msc2020: ["46S10", "26E30", "15A75", "58B99", "68V20"]

