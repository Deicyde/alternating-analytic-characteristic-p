    assumption is added. The operator-valued analytic alternating Hom section, exact fiber and local operator-coordinate
    formulas, and identity/composition laws are proved, with no extra family-preservation premise in the
    finite-coordinate specialization. The literal VB opposite times VB to VB functor, canonical model/fiber/topology
