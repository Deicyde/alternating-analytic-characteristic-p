version: 'v0.4'
project:
  name: alternating-analytic-characteristic-p
  description: >-
    Lean 4 / Mathlib formalization of the paper "Alternating bundles and analytic descent".
    Every theorem, proposition, lemma and corollary of the paper except Proposition 6.6 has a
    challenge file with a proved solution; challenge.md lists them.
  authors:
  - Jack McCarthy
  responsible_maintainers:
  - Jack McCarthy
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: Alternating bundles and analytic descent
  authors:
  - Jack McCarthy
  contributors:
  - name: Claude (Anthropic)
    role: developed the original counterexample and its first write-up with the author
  - name: Codex (OpenAI)
    role: later research, exposition and the October 2026 reorganization of the paper
  id: https://github.com/Deicyde/alternating-analytic-characteristic-p/blob/main/paper/charp.pdf
  type: manuscript
  location: see challenge.md
  relationship: formalizes
  note: paper/ holds the current manuscript; sources/ holds the snapshot from 2026-09-23.
  author_endorsement: participated
related_formalizations:
- id: https://github.com/Deicyde/alternating-analytic-counterexample
  relationship: other
  note: >-
    Earlier characteristic-two counterexample. Its multilinear tail lemma
    was ported here for Lemma F.2.
classification:
  arxiv:
  - math.FA
  - math.DG
  msc2020:
  - '46S10'
  - '26E30'
  - '15A75'
  - '58B99'
  - '68V20'
status:
  scope: >-
    The 76 claims listed in challenge.md are formalized: every theorem, proposition, lemma and
    corollary of the paper other than Proposition 6.6, together with three remarks and two unnumbered
    statements.
    Proposition 6.6 has a written proof only. Each challenge file lists how its Lean statement
    differs from the paper. The comparator was run on comparator.json only; the per-claim
    configs in Challenges/ were checked by scripts/check_claim.py. Theorem 7.2 and Proposition 7.3
    are stated at chart level,
    because Mathlib has no differential forms on manifolds.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: AlternatingAnalyticChallenge.false_of_contDiff_omega_compContinuousLinearMapCLM_charP_banach
    file: solution.lean
    sorry_count: 0
    comparator_config: comparator.json
  - declaration: AlternatingAnalyticChallenge.contDiff_compContinuousLinearMapCLM_of_sphericallyComplete
    file: solution.lean
    sorry_count: 0
    comparator_config: comparator.json
  - declaration: AlternatingAnalyticChallenge.contMDiffVectorBundle_alternating_of_finiteCoordinates
    file: solution.lean
    sorry_count: 0
    comparator_config: comparator.json
  - declaration: AlternatingAnalyticChallenge.ThmF_1.exists_nowhere_analytic_scalar_in_bounded_sequences
    file: Solutions/ThmF_1.lean
    sorry_count: 0
    comparator_config: Challenges/ThmF_1.json
  - declaration: AlternatingAnalyticChallenge.Thm6_3.analytic_on_homs_iff
    file: Solutions/Thm6_3.lean
    sorry_count: 0
    comparator_config: Challenges/Thm6_3.json
automation:
  spend_usd: 200
  methods:
  - method: agent
    models:
    - gpt-6-astra
    framework: Codex desktop with Autoform
    tool_setup: The original library, through 2026-10-01.
  - method: agent
    models:
    - claude-opus-5-5
    framework: Claude Code workflows
    tool_setup: >-
      The per-claim challenge files and the 31 claims not covered by the original library,
      on 2026-10-08. Every claim is checked by scripts/check_claim.py.
  notes: >-
    The spend covers the Codex phase, priced at the ChatGPT Pro subscription as specified by the
    maintainer. The cost of the Claude Code phase was not recorded.
fidelity:
  divergences: Each challenge file's docstring lists its divergences; challenge.md summarizes them.
review:
  status: agent-reviewed
  reviewers: []
  notes: >-
    No human expert has reviewed the paper or the Lean statements. The statement of Theorem 2.1
    was written during formalization and has not been reviewed by the author.
alignment:
  namespace: AlternatingAnalytic
  theorem_map: challenge.md
acknowledgements: Mathlib and its contributors; leanprover/comparator.
