    admit, new axiom or native_decide uses. solution.lean contains the two proved comparator
    theorems; challenge.lean contains exactly two deliberate theorem placeholders and is
    excluded from these proof-development sorry counts. The comparator contains two simple
    contradiction corollaries in a challenge importing only Mathlib. The single transparent
    predicate AlternatingAnalyticChallenge.BanachPrecompositionAnalytic K k names the original
    fixed-field universal hypothesis and is defined identically in challenge.lean and
    solution.lean. The first theorem refutes the universal ContDiff omega assertion over all
    nontrivially normed fields, all normed-space triples and all finite index types in universe zero. The
    second fixes arbitrary K : Type u of prime characteristic p and k >= p, and refutes the
    universal ContDiff K omega assertion over Banach E,F : Type u with E' = E and index Fin k;
    no completeness of K is assumed. These are consequences of the constructive development,
    not claims of equivalence with the full main theorem or factorial classification. All
    stronger results remain proved in the unchanged AlternatingAnalytic library. Library builds
    and all-owned transitive axiom checks are recorded separately from comparator validation
    and model review. Excluded are the expressly unproved alternative infinite-field route,
    announced large-index ultrametric-target construction, mathematical open problems, the
    external Serre c_0(I) classification, and the earlier characteristic-two proof. A broader
    generic isometric-field-transport abstraction in the initial plan is not claimed as a
    separate theorem; every concrete field and finite-index passage used by the paper is proved.
