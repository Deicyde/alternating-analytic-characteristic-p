    role: credited by the paper for producing the informal result, proof, and write-up
  id: https://github.com/Deicyde/alternating-analytic-characteristic-p/blob/main/paper/charp.pdf
  type: manuscript
  location: Counterexample theorem (thm:main), operator Corollary cor:class, all four categorical Main
    Theorem parts in their stated scopes, finite-coordinate/finite-dimensional operator positives, the
    split-domain and completion consequences, and supporting proved complements
  relationship: formalizes
  note: The current manuscript is paper/charp.pdf with source paper/charp.tex; sources/ contains historical
    snapshots. The original Claude-assisted informal result, proof and write-up remain attributed separately
    from the later Codex/Autoform formalization and editorial work. The original operator results and
    all four categorical main parts now have checked Lean declarations. Part (3) retains fixed analytic
    bases with explicit continuous finite coordinates, arbitrary normed model fibers and topological/normable
    actual fibers, all degrees/dimensions and no completeness assumptions. Its actual ContMDiffVectorBundle
    omega witness is the fourth comparator statement. Part (4) is over the concrete incomplete t-adic
    F_p(t), every prime p and radius 0<r<1, all k≥p, and universe-zero normed-space objects; it includes
    all four full/replete and finite-nonarchimedean ambient variants. The split-domain limit and actual
    completed-L-action with a p-linear coordinate-product lift are also formalized. This does not settle
    largest-domain questions over complete fields or Banach pairs. Further proved manuscript extensions
    remain pending, as mapped in THEOREM_MAP.md. Open problems, the alternative infinite-field obstruction
    and the proposed large-index construction are not claimed as proved results.
  license: ''
  author_endorsement: participated
- title: Existing Lean ingredients supplied with the round-24 paper materials
  authors: []
  id: https://github.com/Deicyde/alternating-analytic-characteristic-p/tree/main/AlternatingAnalytic/Analysis
  type: software
  relationship: adapts
  note: Existing proofs of the lift criterion, factorial-invertible positive result, symmetric diagonal
    obstruction, positive-characteristic ultrametricity, spherical completeness and extension, and the
    operator form of Main Theorem (2) were integrated into the development. These supplied ingredients
    are distinct from proofs newly authored in the formalization session; their exact original model authorship
    is not inferred here.
