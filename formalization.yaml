  arxiv: ["math.FA", "math.DG"]
  msc2020: ["46S10", "26E30", "15A75", "58B99", "68V20"]

status:
  scope: >
    Complete for the original proved-paper scope recorded in THEOREM_MAP.md. The later
    finite-dimensional source/codomain proposition, target-reduction argument and weighted c_0
    example are additional informal results and are not claimed as separate formalized declarations. The proof library has zero unresolved sorry,
    admit, new axiom or native_decide uses. solution.lean contains the three proved comparator
    theorems; challenge.lean contains exactly three deliberate theorem placeholders and is
    excluded from these proof-development sorry counts. The Mathlib-only challenge contains
    two contradiction corollaries and the positive Theorem A. Two transparent predicates,
    AlternatingAnalyticChallenge.BanachPrecompositionAnalytic and
    AlternatingAnalyticChallenge.SphericallyComplete, are defined identically in challenge.lean
    and solution.lean. The first names the original fixed-field universal hypothesis; the
    second is the closed-ball intersection property used by the library's spherical-completeness
    class. The first theorem refutes the universal ContDiff omega assertion over all
    nontrivially normed fields, all normed-space triples and all finite index types in universe zero. The
    second fixes arbitrary K : Type u of prime characteristic p and k >= p, and refutes the
    universal ContDiff K omega assertion over Banach E,F : Type u with E' = E and index Fin k;
    no completeness of K is assumed. These two corollaries are consequences of the constructive
    development, not claims of equivalence with the full main theorem or factorial classification.
    The third theorem is Theorem A: for independent universes of K, E, E', F and the finite index
    type, an ultrametric nontrivially normed K and an ultrametric normed F with explicit spherical
    completeness hypothesis give ContDiff K n for every n : WithTop ℕ∞, including omega.
    E and E' are arbitrary normed spaces; K, E and E' need not be complete. All stronger results
    remain proved in the unchanged AlternatingAnalytic library. Challenge validation uses Kim
    Morrison's leanprover/comparator exclusively, with the three selected theorems and permitted
    axioms specified in comparator.json. Excluded are the expressly unproved alternative infinite-field route,
    announced large-index ultrametric-target construction, mathematical open problems, the
    external Serre c_0(I) classification, and the earlier characteristic-two proof. A broader
    generic isometric-field-transport abstraction in the initial plan is not claimed as a
    separate theorem; every concrete field and finite-index passage used by the paper is proved.
