  - title: "Precomposition on continuous alternating maps is not analytic in positive characteristic"
    authors: ["Jack McCarthy"]
    contributors:
      - name: "Claude (Anthropic), working in Claude Code"
        role: "credited by the paper for producing the informal result, proof, and write-up"
    id: "https://github.com/Deicyde/alternating-analytic-characteristic-p/blob/main/sources/charp.pdf"
    type: "manuscript"
    location: "Theorem main, Corollary class, and the proved statements and complements of Sections 2–7"
    relationship: "formalizes"
    note: >
      The bibliographic author is taken from the preserved LaTeX author field. Its thanks
      paragraph separately credits Anthropic's Claude and independent Claude proof audits.
      sources/charp.pdf and sources/charp.tex are the exact snapshots captured at task start.
      Statements in that historical snapshot saying that the new main theorem is not yet
      machine-checked describe its earlier status, before this formalization. A later original
      file revision changes only Theorem A's provenance wording; both versions' hashes and
      the editorial diff are retained in verification/provenance/. The stated mathematical
      claims are unchanged. The source's announced and open items are not claimed as proved.
    license: ""
    author_endorsement: "participated"
  - title: "Existing Lean ingredients supplied with the round-24 paper materials"
    authors: []
    id: "https://github.com/Deicyde/alternating-analytic-characteristic-p/tree/main/verification/provenance"
    type: "software"
    relationship: "adapts"
    note: >
      Existing proofs of the lift criterion, factorial-invertible positive result, symmetric
      diagonal obstruction, positive-characteristic ultrametricity, spherical completeness
      and extension, and Theorem A were integrated and checked. Source paths, source hashes,
      changes and checks are recorded by integration-manifest.json,
      integration-positive-manifest.json and spherical-analytic-provenance.json. Their exact
      original model authorship is not inferred from the current formalization session.
    license: ""
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/Deicyde/alternating-analytic-counterexample"
    relationship: "other"
    note: >
      Earlier characteristic-two formalization used as a workflow precedent and cited by the
      paper for comparison. Its different Pfaffian/parity construction is not re-proved or
      re-audited here, and that repository is unchanged. This project establishes the new
      every-prescribed-field result with a target having no equivalent ultrametric norm.

classification:
  arxiv: ["math.FA", "math.DG"]
  msc2020: ["46S10", "26E30", "15A75", "58B99", "68V20"]

