status:
  scope: >-
    Complete for the original proved-paper scope recorded in THEOREM_MAP.md, but not for the expanded
    manuscript as a whole. The operator inputs to parts (1) and (2), and the joint action with its
    functorial laws, are formalized; bundled categorical functors and their joint regularity classification
    remain pending. Finite-coordinate analytic reflection, core admissible-family laws, the invertible-shear
    counterexample and canonical exterior support now have checked declarations. Main Theorem (3)
    and (4), the bundle, additional parameter, tensor, universal-target-core and no-largest-domain
    results still require formalization. The coefficient-radius refinement, quotient-parameter obstruction,
    polynomial-approximation example without a common analytic radius, set-sized maximal-domain graph
    proposition, explicit completion principle are likewise proved informal mathematics, not new Lean
    declarations. Canonical exterior support, its degree-zero/one cases and the finite-ambient matrix
    formula are formalized; transport of the matrix formula from a finite supporting subspace into
    arbitrary ambient V remains pending. The earlier finite-dimensional source/codomain proposition,
    target-reduction argument and weighted c_0 example are likewise additional informal results, not
    separate formalized declarations. The proof library has zero unresolved sorry, admit, new axiom
    or native_decide uses. solution.lean contains the three proved comparator theorems; challenge.lean
    contains exactly three deliberate theorem placeholders and is excluded from these proof-development
    sorry counts. The Mathlib-only challenge contains two contradiction corollaries and the positive
    operator form of Main Theorem (2). Two transparent predicates, AlternatingAnalyticChallenge.BanachPrecompositionAnalytic
    and AlternatingAnalyticChallenge.SphericallyComplete, are defined identically in challenge.lean
    and solution.lean. The first names the original fixed-field universal hypothesis; the second is
    the closed-ball intersection property used by the library's spherical-completeness class. The
    first theorem refutes the universal ContDiff omega assertion over all nontrivially normed fields,
    all normed-space triples and all finite index types in universe zero. The second fixes arbitrary
    K : Type u of prime characteristic p and k >= p, and refutes the universal ContDiff K omega assertion
    over Banach E,F : Type u with E' = E and index Fin k; no completeness of K is assumed. These two
    corollaries are consequences of the constructive development, not claims of equivalence with the
    full operator counterexample or factorial classification. The third theorem is the operator form
    of Main Theorem (2): for independent universes of K, E, E', F and the finite index type, an ultrametric
    nontrivially normed K and an ultrametric normed F with explicit spherical completeness hypothesis
    give ContDiff K n for every n : WithTop ℕ∞, including omega. E and E' are arbitrary normed spaces;
    K, E and E' need not be complete. The stronger original operator results are proved in the
    AlternatingAnalytic library. Challenge validation uses Kim Morrison's leanprover/comparator exclusively, with the
    three selected theorems and permitted axioms specified in comparator.json. Excluded are the expressly
    unproved alternative infinite-field route, proposed unproved large-index nonarchimedean-target
    construction, mathematical open problems, the external Serre c_0(I) classification, and the earlier
    characteristic-two proof. A broader generic isometric-field-transport abstraction in the initial
    plan is not claimed as a separate theorem; every concrete field and finite-index passage used
    in the original formalized counterexample is proved. The new Codex proof run added the checked
    reflection, core-family, shear and canonical-support modules through Autoform's shared verification gate. The remaining
    proof plan and Mathlib API searches are preparation, not completed proofs; FORMALIZATION_ROADMAP.md
    retains the full outstanding scope. This includes the joint categorical classification and spherical-target
    packaging, both finite-coordinate operator cases, finite-target reduction, the weighted nonspherical-target
    example, the general C^n multifunctor bundle construction, the additional parameter-space bundle
    cases, and admissible inverse families. These tasks are not discharged merely by proving the first
    three worker targets.
