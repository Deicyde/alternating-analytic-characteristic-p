    model fibers and the existing topological actual fibers. All dimensions and degrees including zero are allowed; there is no completeness, characteristic or factorial assumption. All four passed local comparator and default-kernel checks. This does not certify the separately proved analytic bundle category or alternating bundle morphisms, or the separately proved final bundle bifunctor.'
