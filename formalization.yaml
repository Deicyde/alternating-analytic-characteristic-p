automation:
  spend_usd: 200
  methods:
    - method: "agent"
      models: ["gpt-6-astra"]
      framework: "Codex desktop with Autoform"
      tool_setup: >
        GPT-6 Astra in Codex coordinated native proof workers through Autoform's durable
        dependency plan. Workers constructed Lean proofs and iterated with the pinned Lean
        toolchain; separate checks built the modules and audited transitive axiom dependencies.
        Final library verification enumerated all module-owned declarations, including private
        and compiler-generated declarations. Statement audits compared the actual Lean objects
        with the frozen paper. Comparator wrappers and repository metadata were prepared in
        the same Codex session. Lean 4.34.0-rc2 and the exact Mathlib revision are locked by
        lean-toolchain, lakefile.toml and lake-manifest.json.
      prompting_notes: >
        Jack McCarthy requested formalization of the supplied characteristic-p paper in the
        style of the earlier characteristic-two project, then requested a private repository,
        formalization.yaml metadata and comparator files. The proof task retained arbitrary
        prescribed fields, incomplete bases, every allowed degree, every base point and the
        actual Banach witnesses; it did not replace the target by an assumed obstruction.
    - method: "other"
      models: []
      framework: "Integration of pre-existing Lean proof sources"
      tool_setup: >
        The supplied existing ingredients were preserved or adapted in the library.
        They are not represented as newly authored proofs from
        the current GPT-6 Astra run. The paper's informal Claude/Claude Code authorship is
        recorded under sources and is distinct from the current formalization automation.
  notes: >
    The reported total cost is USD 200, using the ChatGPT Pro subscription price specified
    by the maintainer. Hardware specifications and end-to-end runtime were not measured
    reliably for the whole project. Existing proof integrations and newly constructed proofs
    remain distinct. From the repository cleanup onward, the challenge and solution are
    checked only with Kim Morrison's leanprover/comparator; the earlier custom verification
    scripts and audit records have been removed from the current repository.

fidelity:
  divergences: >
    The full main theorem keeps every prescribed nontrivially normed positive-characteristic
    field, including incomplete fields, and every k >= p. It produces E' = E with actual
    completeness and no equivalent ultrametric target norm; the same witnesses work for every
    finite index type of cardinality k and every base point. The no-lift and nowhere-C^omega
    formulations are bundled explicitly. The classification uses Fin k, with genuine
    finite-index transport for other finite types; its positive direction applies to arbitrary
    normed spaces and degree zero. Several auxiliaries are generalized, including arbitrary
    discrete index sets for the Laurent coefficient construction and arbitrary ordered
    unconditional Schauder bases with the source's orthogonal coordinate bound for the sorted
    lift. The coefficient map is kappa-linear, not Laurent-field-linear; the projective norm
    uses ordinary sums. The formalization does not assert injectivity of the completed
    determinant-array map. The comparator deliberately exposes only two contradiction
    corollaries in the earlier characteristic-two challenge style. Its general assertion
    quantifies over types in universe zero; its characteristic-p corollary fixes arbitrary
    K : Type u and ranges over Banach E,F : Type u with index Fin k. The global statement uses
    Mathlib constants directly. The fixed-field hypothesis uses the transparent predicate
    BanachPrecompositionAnalytic K k, defined identically in both comparator files using
    Mathlib's existing definitions; unfolding it recovers the original quantified hypothesis.
    Neither is presented as equivalent to the full constructive main theorem or factorial
    classification; those stronger theorems and their general universe
    parameters remain in the library. The comparator checks the current challenge and solution
    against comparator.json, including the fixed predicate and transitive dependencies.
    No announced or open paper claim is included as an axiom.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >
    Earlier semantic reviews and separate model jury passes examined selected declarations
    for faithfulness, proof integrity and code quality. Some reviews returned mixed scores,
    abstentions or timeouts; no global clean-jury result or human expert review is claimed.
    The paper received a subsequent editorial pass with substantive explanations compared
    against the Lean development. Current challenge validation uses the comparator.

alignment:
  namespace: "AlternatingAnalytic"
  theorem_map: "THEOREM_MAP.md"
  comparator_scope: >
    Two contradiction corollaries of the proved construction, with only Mathlib imports in
    the challenge: the universal all-fields analytic-smoothness assertion, and the
    fixed-prescribed-field Banach assertion in characteristic p and degree k >= p. The latter
    names its original universal hypothesis BanachPrecompositionAnalytic K k. The source
    alignment below records the stronger library theorems, not an asserted equivalence with these challenge corollaries.
  statements:
    - source: "Theorem main and adjacent C^omega sharpness statement"
      lean: "AlternatingAnalytic.exists_banach_counterexample_full"
      module: "AlternatingAnalytic.MainTheorem"
      status: "proved"
      note: "All prescribed fields, actual Banach E = E', no equivalent ultrametric target norm, all finite indices and all base points."
    - source: "Explicit construction underlying Theorem main"
      lean: "AlternatingAnalytic.exists_nowhereAnalytic_banach_counterexample"
      module: "AlternatingAnalytic.Main"
      status: "proved"
    - source: "Corollary class: the exact factorial classification"
      lean: "AlternatingAnalytic.factorial_ne_zero_iff_allBanachPrecompositionAnalytic"
      module: "AlternatingAnalytic.Analysis.FactorialClassification"
      status: "proved"
    - source: "Proposition lift: bounded lift and analyticity equivalences"
      lean: "Round24Transfer.tfae_Q"
      module: "AlternatingAnalytic.Analysis.LiftCriterion"
      status: "proved"
      note: "Integrated existing source proof, with provenance retained."
    - source: "Theorem FF: the finite-field multiplier obstruction"
      lean: "AlternatingAnalytic.finiteField_multiplier_theorem"
      module: "AlternatingAnalytic.Algebra.FiniteFieldTheorem"
      status: "proved"
      note: "The needed infinite Ramsey theorem is proved locally; the obstruction is not an axiom."
    - source: "Proposition supp: the completed coefficient map and sharp support estimate"
      lean: "AlternatingAnalytic.completedLaurentCoefficient_full_properties"
      module: "AlternatingAnalytic.Analysis.LaurentCoefficientTheorem"
      status: "proved"
    - source: "Lemma Psi: all four residue-lift properties, including full grouped polarization"
      lean: "AlternatingAnalytic.laurentResidueLift_full_properties"
      module: "AlternatingAnalytic.Analysis.LaurentResidueTheorem"
      status: "proved"
    - source: "Proposition nonultra: the target admits no equivalent ultrametric norm"
      lean: "AlternatingAnalytic.laurentExterior_not_hasEquivalentUltrametricNorm"
      module: "AlternatingAnalytic.Analysis.LaurentCompletedCoefficient"
      status: "proved"
      note: "Disjoint-block growth is also transported to the final prescribed-field witnesses."
    - source: "Lemma ext(2): heterogeneous dense multilinear extension"
      lean: "AlternatingAnalytic.exists_denseMultilinearFamilyExtension_of_bound"
      module: "AlternatingAnalytic.Analysis.DenseMultilinearFamilyExtension"
      status: "proved"
    - source: "Remark K2: nonspherical completeness and descending empty balls"
      lean: "AlternatingAnalytic.hasEmptyDescendingBallSequence_iff"
      module: "AlternatingAnalytic.Analysis.NonsphericalSequence"
      status: "proved"
    - source: "Remark FFunit: the normalized multiplier example and its support and cluster values"
      lean: "AlternatingAnalytic.normalizedMultiplierLift_pol1, AlternatingAnalytic.exteriorSupportDim_normalizedMultiplierLift_le, AlternatingAnalytic.clusterValue_normalizedClusterLift"
      module: "AlternatingAnalytic.Algebra.NormalizedMultiplierLift"
      status: "proved"
    - source: "Remark sorted: the contracting lift and its actual convergent infinite determinant formula"
      lean: "AlternatingAnalytic.exists_sortedSchauderLift"
      module: "AlternatingAnalytic.Analysis.SortedBasisFormula"
      status: "proved"
    - source: "Theorem A: spherically complete ultrametric targets"
      lean: "ContinuousAlternatingMap.contDiff_compContinuousLinearMapCLM_of_sphericallyComplete"
      module: "AlternatingAnalytic.Analysis.SphericalAnalytic"
      status: "proved"
      note: "Proved in the current paper following its existing Lean proof."
    - source: "Proposition discrete: complete targets with an equivalent ultrametric norm"
      lean: "AlternatingAnalytic.analyticAt_of_equivalentUltrametricNorm_discreteValueGroup"
      module: "AlternatingAnalytic.Analysis.DiscreteTargetAnalytic"
      status: "proved"
    - source: "Remark routeII, announced Remark R, explicit mathematical open problems, and externally cited Serre classification"
      lean: ""
      module: ""
      status: "not-formalized"
      note: "Explicit exclusions from the proved-paper scope; see THEOREM_MAP.md."

