version: 'v0.4'
project:
  name: alternating-analytic-characteristic-p
  description: 'Lean 4 / Mathlib formalization of alternating-map functors and vector bundles. The library
    proves the prescribed-field Banach counterexample and sharp factorial classification, the actual normed/Banach/spherical
    categorical functors and their joint regularity, and the finite-coordinate analytic alternating bundle
    and literal bundle bifunctor with operator-valued analytic morphisms. It also proves both continuous-finite-coordinate
    operator-positive cases and their finite-dimensional corollary over complete fields. Main Theorem
    (4) is formalized over the t-adic rational field F_p(t), for every prime p, radius 0<r<1 and degree
    k≥p: no largest full analytic domain exists, including the relatively isomorphism-closed variants
    and the finite algebraic dimensional nonarchimedean ambient. The construction includes the split-domain
    limit and its explicit analytic completed-L-action/coordinate-lift comparison. Core family laws, shear,
    radius preservation, canonical exterior support and the scalar/determinant prerequisites are also
    checked. The expanded manuscript remains partly formalized; the full 71-node extension plan continues
    with parameter-space/tensor branches, finite-value-target reduction, further bundle cases, family/support
    transport and set-sized maximality. THEOREM_MAP.md records exact scope.'
  authors:
  - Jack McCarthy
  responsible_maintainers:
  - Jack McCarthy
  license: No license chosen yet (all rights reserved pending the maintainer's decision)
repository:
  role: substantive-development
sources:
- title: Analyticity of alternating-map functors and vector bundles
  authors:
