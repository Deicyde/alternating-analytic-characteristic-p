alignment:
  namespace: AlternatingAnalytic
  theorem_map: THEOREM_MAP.md
  comparator_scope: 'Four theorems in a challenge importing only Mathlib. Two are contradiction corollaries
    of the proved construction: the universal all-fields analytic-smoothness assertion, and the fixed-prescribed-field
    Banach assertion in characteristic p and degree k >= p. The latter names its original universal hypothesis
    BanachPrecompositionAnalytic K k. The third is the operator form of Main Theorem (2) for independent
    universes, arbitrary finite indices and all differentiability orders n : WithTop ℕ∞, including omega,
    with explicit hF : SphericallyComplete F. Both predicates are fixed transparent definitions identical
    in challenge and solution. The source alignment below records the stronger library theorems, not an
    asserted equivalence between the two contradiction corollaries and the full negative results. The
    fourth is the actual ContMDiffVectorBundle omega theorem for alternating fibers over a self-model
    analytic base with supplied continuous finite coordinates, arbitrary normed model fibers and the existing
    topological actual fibers. All dimensions and degrees including zero are allowed; there is no completeness,
    characteristic or factorial assumption. All four passed local comparator and default-kernel checks.
    This does not certify the separately proved analytic bundle category or alternating bundle morphisms,
    or the separately proved final bundle bifunctor.'
  statements:
  - source: Counterexample theorem (thm:main) and adjacent C^omega sharpness statement
    lean: AlternatingAnalytic.exists_banach_counterexample_full
    module: AlternatingAnalytic.MainTheorem
    status: proved
    note: All prescribed fields, actual Banach E = E', no equivalent ultrametric target norm, all finite
      indices and all base points.
  - source: Explicit construction underlying the Counterexample theorem (thm:main)
    lean: AlternatingAnalytic.exists_nowhereAnalytic_banach_counterexample
    module: AlternatingAnalytic.Main
    status: proved
  - source: 'Corollary cor:class: the exact operator factorial classification'
