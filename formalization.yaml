version: '0.4'
project:
  name: alternating-analytic-characteristic-p
  description: 'Lean 4 / Mathlib formalization of alternating-map functors. For every prescribed nontrivially
    normed field K of prime characteristic p, including incomplete K, and every k >= p, the construction
    gives Banach witnesses with nowhere-analytic alternating precomposition and no equivalent nonarchimedean
    target norm. The library proves the sharp factorial classification and categorical Main Theorem (1)
    and (2), including unconditional joint smoothness and the spherical-target positive case. Checked
    extensions include finite-coordinate analytic reflection, radius preservation, alternating morphism
    families on open coordinate domains and manifolds, actual finite-coordinate analytic alternating bundles,
    core admissible-family laws, the invertible-shear obstruction and canonical exterior support. The
    expanded manuscript remains only partly formalized: bundle morphisms and the bundle-category functor,
    further parameter and tensor results, and analytic-domain results remain unfinished. THEOREM_MAP.md
    records the exact scope and review status.'
  authors:
  - Jack McCarthy
  responsible_maintainers:
  - Jack McCarthy
  license: No license chosen yet (all rights reserved pending the maintainer's decision)
repository:
  role: substantive-development
sources:
- title: Analyticity of alternating-map functors and vector bundles
  authors:
  - Jack McCarthy
  contributors:
  - name: Claude (Anthropic), working in Claude Code
    role: credited by the paper for producing the informal result, proof, and write-up
  id: https://github.com/Deicyde/alternating-analytic-characteristic-p/blob/main/paper/charp.pdf
  type: manuscript
  location: Counterexample theorem (thm:main), operator Corollary cor:class, categorical Main Theorem
    (1) and (2), finite-coordinate family and open-manifold prerequisites for Main Theorem (3), and supporting
    proved complements
  relationship: formalizes
  note: The current manuscript is paper/charp.pdf, with editable source paper/charp.tex; sources/ contains
    historical snapshots. Its disclosure credits the original Claude-assisted informal work separately
    from the later Codex/Autoform formalization and editorial work. The original operator results, categorical
    Main Theorem (1) and (2), and finite-coordinate family and open-manifold prerequisites for part (3)
    have Lean proofs. The manifold results allow arbitrary normed fibers, every characteristic and degree,
    and explicit continuous finite coordinates without completeness assumptions. The actual finite-coordinate
    analytic alternating bundle is also proved. Its operator-valued morphisms and categorical bundle functor,
    part (4)'s no-largest-domain theorem, and the remaining proved extensions are not yet formalized.
    Theorem-level boundaries are in THEOREM_MAP.md. Open problems, the alternative infinite-field obstruction
    and the proposed large-index construction are not claimed as proved results.
  license: ''
  author_endorsement: participated
- title: Existing Lean ingredients supplied with the round-24 paper materials
  authors: []
  id: https://github.com/Deicyde/alternating-analytic-characteristic-p/tree/main/AlternatingAnalytic/Analysis
  type: software
  relationship: adapts
  note: Existing proofs of the lift criterion, factorial-invertible positive result, symmetric diagonal
    obstruction, positive-characteristic ultrametricity, spherical completeness and extension, and the
    operator form of Main Theorem (2) were integrated into the development. These supplied ingredients
    are distinct from proofs newly authored in the formalization session; their exact original model authorship
    is not inferred here.
  license: ''
  author_endorsement: n/a
related_formalizations:
- id: https://github.com/Deicyde/alternating-analytic-counterexample
  relationship: other
  note: Earlier characteristic-two formalization used as a workflow precedent and cited by the paper for
    comparison. Its different Pfaffian/parity construction is not re-proved or re-audited here, and that
    repository is unchanged. This project establishes the new every-prescribed-field result with a target
    having no equivalent ultrametric norm.
